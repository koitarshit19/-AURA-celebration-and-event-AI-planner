    <script>
      (function () {
        // 1. Suppress uncaught third-party browser extension errors
        window.addEventListener(
          'error',
          function (e) {
            var isExt =
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1);
            if (isExt) {
              e.preventDefault && e.preventDefault();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reasonMsg = e && e.reason && (e.reason.message || String(e.reason));
            if (reasonMsg && reasonMsg.indexOf('Cannot set property fetch') !== -1) {
              e.preventDefault && e.preventDefault();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        var prevOnError = window.onerror;
        window.onerror = function (msg, url) {
          if (
            (typeof url === 'string' && url.indexOf('chrome-extension://') !== -1) ||
            (typeof msg === 'string' && msg.indexOf('Cannot set property fetch') !== -1)
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        // 2. Ensure window.fetch has both a getter and a setter so extension property assignment succeeds
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = realFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return activeFetch;
                },
                set: function (fn) {
                  activeFetch = fn;
                },
              });
            } catch (_) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return activeFetch;
              },
              set: function (fn) {
                activeFetch = fn;
              },
            });
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
